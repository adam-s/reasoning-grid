<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.svg" />
    <title>Model Reasoning Mapped to an OODA Loop</title>
    <meta name="description" content="Reasoning models map cleanly onto Boyd's law of iteration. Two of them, from different companies, measured on 7,554 long multiplications to find where that loop stops being reliable." />

    <!-- ---- THE CARD THAT SHOWS WHEN THIS IS PASTED SOMEWHERE --------------
         Facebook, iMessage, Slack and the rest read these, and every one of
         them requires an ABSOLUTE url for the image. `base: './'` in
         vite.config.ts makes every other asset on this page relative so the
         build works at any subpath, and these four tags are the exception that
         cannot: a scraper resolves them against nothing. If the deploy path
         ever moves off /reasoning-grid/, these are the lines that break, and
         they break silently -- the page still works and the preview just goes
         blank. `scripts/build-og-card.mjs` regenerates og.png; the width and
         height below are the card's real pixels (2x a 1200x630 layout), not
         the size it gets displayed at, so they change when that script does. -->
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="adamsohn.com" />
    <meta property="og:url" content="https://adamsohn.com/reasoning-grid/" />
    <meta property="og:title" content="Model Reasoning Mapped to an OODA Loop" />
    <meta property="og:description" content="Reasoning models map cleanly onto Boyd's law of iteration. This measures where that loop stops being reliable." />
    <meta property="og:image" content="https://adamsohn.com/reasoning-grid/og.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="A 3D surface of the probability a model returns the exactly correct product, falling from a high plateau at small digit counts to near zero at large ones." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Model Reasoning Mapped to an OODA Loop" />
    <meta name="twitter:description" content="Reasoning models map cleanly onto Boyd's law of iteration. This measures where that loop stops being reliable." />
    <meta name="twitter:image" content="https://adamsohn.com/reasoning-grid/og.png" />

    <!-- WITHOUT JAVASCRIPT, GIVE THE SPACE BACK.
         figure-heights.css holds every figure's box open at its measured
         height, because the figure arrives a tenth of a second after the prose
         and the page must not jump when it does. A reader with JavaScript off
         is never getting the figure, so those nine reservations are about
         5,000px of empty cream to scroll past. Each box keeps only its one-line
         description. -->
    <noscript><style>[data-fig] { min-height: 0 !important; }</style></noscript>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
