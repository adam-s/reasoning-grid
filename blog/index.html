<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.svg" />
    <title>A probability grid of chain-of-thought, read through Boyd's OODA loop lens</title>
    <meta name="description" content="Reasoning models map cleanly onto Boyd's law of iteration. This measures where LLMs stop being reliable." />

    <!-- ---- THE CARD THAT SHOWS WHEN THIS IS PASTED SOMEWHERE --------------
         Facebook, iMessage, Slack and the rest read these, and every one of
         them requires an ABSOLUTE url for the image. `base: './'` in
         vite.config.ts makes every other asset on this page relative so the
         build works at any subpath, and these four tags are the exception that
         cannot: a scraper resolves them against nothing. If the deploy path
         ever moves off /reasoning-grid/, these are the lines that break, and
         they break silently -- the page still works and the preview just goes
         blank. `scripts/build-og-card.mjs` regenerates og.png; the width and
         height below are the card's real pixels (2x a 1200x630 layout), not
         the size it gets displayed at, so they change when that script does. -->
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="adamsohn.com" />
    <meta property="og:url" content="https://adamsohn.com/reasoning-grid/" />
    <meta property="og:title" content="A probability grid of chain-of-thought, read through Boyd's OODA loop lens" />
    <meta property="og:description" content="Reasoning models map cleanly onto Boyd's law of iteration. This measures where LLMs stop being reliable." />
    <meta property="og:image" content="https://adamsohn.com/reasoning-grid/og.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="A 3D surface of the probability a model returns the exactly correct product, falling from a high plateau at small digit counts to near zero at large ones." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="A probability grid of chain-of-thought, read through Boyd's OODA loop lens" />
    <meta name="twitter:description" content="Reasoning models map cleanly onto Boyd's law of iteration. This measures where LLMs stop being reliable." />
    <meta name="twitter:image" content="https://adamsohn.com/reasoning-grid/og.png" />

    <!-- WITHOUT JAVASCRIPT, GIVE THE SPACE BACK.
         figure-heights.css holds every figure's box open at its measured
         height, because the figure arrives a tenth of a second after the prose
         and the page must not jump when it does. A reader with JavaScript off
         is never getting the figure, so those nine reservations are about
         5,000px of empty cream to scroll past. Each box keeps only its one-line
         description. -->
    <noscript><style>
      [data-fig] { min-height: 0 !important; }
      /* Every control on this page drives a figure, and no figure runs without
         JavaScript. They ship in the HTML so the layout is final at first paint
         and so #walk-the-surface is a real target before any script runs; this
         is what keeps them from being offered to the one reader who cannot use
         them. */
      .tour-start, .moments, .row-label { display: none !important; }
    </style></noscript>

    <link rel="canonical" href="https://adamsohn.com/reasoning-grid/" />

    <!-- PUT THE TRAILING SLASH BACK, BEFORE ANYTHING ELSE LOADS.
         Every asset path on this page is relative, because `base: './'` in
         vite.config.ts lets the same build work at any subpath. Relative
         resolves against the URL's DIRECTORY, so at /reasoning-grid the
         bundle and the stylesheet resolve to /assets/... and 403.

         CloudFront answers that URL with 200 and this prerendered essay, so
         the result is not a broken page, it is the whole article with no
         styles and no JavaScript. That reads as working to every crawler and
         uptime check there is, which is why it needs fixing here rather than
         being left to look after itself. Inline, because an external script is
         exactly what is not loading. -->
    <script>
      if (location.pathname.length > 1 && !location.pathname.endsWith('/')) {
        location.replace(location.pathname + '/' + location.search + location.hash);
      }
    </script>
  </head>
  <body>
    <div id="app"></div>

    <!-- SCROLL TO THE FRAGMENT NOW, NOT AT LOAD.
         Chrome defers its own fragment scroll until the load event, and load
         waits for the deferred module bundle below. On a 400kbps line that is
         eight seconds of sitting at the top of the page and then being thrown
         down it, which is what this looked like when it was reported as the
         page not rendering.

         This runs earlier than that for two reasons that both depend on where
         it sits. It is inline and after the content, so the target has been
         parsed. And a stylesheet blocks the execution of any script after it,
         so by the time this runs the CSS has applied and the position it
         measures is the real one. The module bundle is deferred and runs later
         still, so nothing here waits on it.

         Instant, not smooth. At this point the reader has had the page for
         about a second and has not started reading; animating a scroll through
         eight thousand pixels would be a performance, not a courtesy. -->
    <script>
      (function () {
        if (!location.hash) return;
        try {
          var el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
          if (el) el.scrollIntoView();
        } catch (e) {}
      })();
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
